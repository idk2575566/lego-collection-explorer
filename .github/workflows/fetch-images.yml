name: Fetch TFWiki Images (Playwright)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 0' # weekly on Sunday at 03:00 UTC (optional)

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright image extractor (sample)
        env:
          TRANSFORMERS_SHEET_ID: ${{ secrets.TRANSFORMERS_SHEET_ID }}
          TRANSFORMERS_SHEET_GID: ${{ secrets.TRANSFORMERS_SHEET_GID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p out
          node scripts/fetch-tfwiki-image.mjs "https://tfwiki.net/wiki/File:SS-Megatron-MTMTE86.jpg" > out/sample-image.json
          echo "Sample image extraction complete"

      - name: Upload sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfwiki-sample-image
          path: out/sample-image.json

      - name: Comment on PR with sample (if PR present)
        if: github.event_name == 'pull_request' || github.event.pull_request
        uses: peter-evans/comment@v2
        with:
          body: |-
            Playwright sample image extraction completed. Download the artifact from the Actions run artifacts to inspect the extracted image URL(s).
